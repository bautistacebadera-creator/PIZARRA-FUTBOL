<!DOCTYPE html>
<html>
<head>
    <title>Conversión Automática de Iconos</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f0f0f0; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        button:hover { background: #0056b3; }
        .status { margin-top: 20px; padding: 10px; background: #e8f5e9; border-radius: 4px; }
        .error { background: #ffebee; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Conversión de Iconos SVG a PNG</h1>
        <p>Este script convertirá automáticamente los nuevos iconos SVG a PNG.</p>
        <button onclick="convertAll()">Convertir Todos los Iconos</button>
        <div id="status" class="status"></div>
    </div>
    
    <script>
        async function convertSVG(svgFile, pngFile, size) {
            try {
                const response = await fetch(svgFile);
                const svgText = await response.text();
                
                const img = new Image();
                const svgBlob = new Blob([svgText], {type: 'image/svg+xml;charset=utf-8'});
                const url = URL.createObjectURL(svgBlob);
                
                return new Promise((resolve, reject) => {
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        canvas.width = size;
                        canvas.height = size;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, size, size);
                        
                        canvas.toBlob(function(blob) {
                            const link = document.createElement('a');
                            link.download = pngFile;
                            link.href = URL.createObjectURL(blob);
                            link.click();
                            URL.revokeObjectURL(url);
                            URL.revokeObjectURL(url);
                            resolve({ success: true, file: pngFile });
                        }, 'image/png');
                    };
                    
                    img.onerror = reject;
                    img.src = url;
                });
            } catch (error) {
                return { success: false, file: pngFile, error: error.message };
            }
        }
        
        async function convertAll() {
            const status = document.getElementById('status');
            status.innerHTML = 'Iniciando conversión...';
            
            const conversions = [
                { svg: 'icon-192.svg', png: 'icon-192.png', size: 192 },
                { svg: 'icon-512.svg', png: 'icon-512.png', size: 512 },
                { svg: 'icon-base.svg', png: 'apple-touch-icon.png', size: 192 },
                { svg: 'icon-base.svg', png: 'icon-maskable-512.png', size: 512 },
            ];
            
            const results = [];
            for (const conv of conversions) {
                const result = await convertSVG(conv.svg, conv.png, conv.size);
                results.push(result);
                status.innerHTML += `<br>${conv.svg} -> ${conv.png}: ${result.success ? '✅ Éxito' : '❌ Error: ' + result.error}`;
            }
            
            const successCount = results.filter(r => r.success).length;
            status.innerHTML += `<br><br><strong>Completado: ${successCount}/${results.length} iconos convertidos</strong>`;
            status.innerHTML += '<br><br><em>Guardá los PNG descargados en la carpeta icons y reemplazá los viejos.</em>';
        }
        
        // Auto-ejecutar después de 1 segundo
        setTimeout(convertAll, 1000);
    </script>
</body>
</html>
