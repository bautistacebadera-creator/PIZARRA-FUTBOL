<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Pizarra 8</title>
<meta name="description" content="Pizarra táctica de fútbol 8 para armar, dibujar y simular jugadas." />

<!-- PWA -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0b1220" />
<meta name="background-color" content="#0b1220" />

<!-- iOS install support -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Pizarra 8" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />

<!-- Tailwind (único recurso externo que queda; si falla, la app igual
     carga, solo se ven mal los estilos, nunca queda en blanco por esto) -->
<script src="https://cdn.tailwindcss.com"></script>

<style>
  html, body { margin: 0; padding: 0; background: #05070f; }
  #root { min-height: 100dvh; }
  #boot-error {
    display: none; position: fixed; inset: 0; background: #05070f;
    color: #eef1f8; font: 13px/1.5 -apple-system, system-ui, sans-serif;
    padding: 24px; overflow: auto; white-space: pre-wrap; z-index: 9999;
  }
  #boot-error h1 { color: #ff6b6b; font-size: 16px; margin: 0 0 10px; }
  #boot-error code { color: #f4b400; }
</style>
</head>
<body>
<div id="root"></div>
<div id="boot-error"></div>

<!-- Si algo falla al cargar/montar la app, esto lo muestra en pantalla
     en vez de dejar una pantalla negra sin pistas. -->
<script>
  function showBootError(msg, where) {
    const box = document.getElementById('boot-error');
    if (!box) return;
    box.style.display = 'block';
    box.innerHTML =
      '<h1>No se pudo cargar la pizarra</h1>' +
      'Revisá la consola (F12) para más detalle. Error:\n<code>' +
      msg + '</code>' + (where ? '\n' + where : '');
  }
  window.addEventListener('error', (e) => {
    const msg = (e && e.error && e.error.stack) ? e.error.stack : (e.message || String(e));
    showBootError(msg, e.filename ? e.filename + ':' + e.lineno : '');
  });
  // Errores de promesas sin capturar (por ejemplo, fallas al montar React o
  // en el registro del service worker) también deben mostrarse, no quedar
  // en silencio con una pantalla negra.
  window.addEventListener('unhandledrejection', (e) => {
    const r = e && e.reason;
    const msg = (r && r.stack) ? r.stack : String(r || 'Error desconocido');
    showBootError(msg, '');
  });
</script>

<script src="storage-polyfill.js"></script>
<!-- app.bundle.js ya trae React, ReactDOM y todo el código de la pizarra
     empaquetados y compilados de antemano: no hay nada que transformar
     ni resolver en el navegador. -->
<script src="app.bundle.js"></script>

<script>
  if ('serviceWorker' in navigator) {
    // Si ya había un service worker controlando esta pestaña, un cambio de
    // controller significa que se activó una versión nueva. Si todavía no
    // había ninguno (primera visita), no es una "actualización".
    const hadController = !!navigator.serviceWorker.controller;
    let notified = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (notified || !hadController) return;
      notified = true;
      window.dispatchEvent(new Event('pizarra8-update-available'));
    });
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    });
  }
</script>
</body>
</html>
