<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Pizarra 8</title>
<meta name="description" content="Pizarra táctica de fútbol 8 para armar, dibujar y simular jugadas." />

<!-- PWA -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#000000" />
<meta name="background-color" content="#000000" />

<!-- iOS install support -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Pizarra 8" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="apple-touch-icon" href="icons/icon-base.svg" />

<link rel="icon" type="image/svg+xml" sizes="192x192" href="icons/icon-192.svg" />
<link rel="icon" type="image/svg+xml" sizes="512x512" href="icons/icon-512.svg" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />

<!-- React, ReactDOM y Babel desde CDN para compilar JSX en el navegador -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>

<style>
  html, body { margin: 0; padding: 0; background: #05070f; user-select: none; -webkit-user-select: none; }
  #root { min-height: 100dvh; user-select: none; -webkit-user-select: none; }
  #boot-error {
    display: none; position: fixed; inset: 0; background: #05070f;
    color: #eef1f8; font: 13px/1.5 -apple-system, system-ui, sans-serif;
    padding: 24px; overflow: auto; white-space: pre-wrap; z-index: 9999;
  }
  #boot-error h1 { color: #ff6b6b; font-size: 16px; margin: 0 0 10px; }
  #boot-error code { color: #f4b400; }
  
  /* Prevenir selección de texto en toda la app */
  * { user-select: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; }
  
  /* Permitir selección solo en campos de texto */
  input, textarea { user-select: text; -webkit-user-select: text; -moz-user-select: text; -ms-user-select: text; }
  
  /* Animaciones */
  @keyframes toastPop {
    0% { transform: translateX(-50%) translateY(20px); opacity: 0; }
    100% { transform: translateX(-50%) translateY(0); opacity: 1; }
  }
  
  @keyframes dustPop {
    0% { transform: scale(0); opacity: 1; }
    100% { transform: scale(1.5); opacity: 0; }
  }
  
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  
  @keyframes scaleIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }
  
  @keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
  
  .dust-pop { animation: dustPop 0.4s ease-out forwards; }
  .slide-in { animation: slideIn 0.3s ease-out forwards; }
  .fade-in { animation: fadeIn 0.4s ease-out forwards; }
  .scale-in { animation: scaleIn 0.3s ease-out forwards; }
  
  /* Optimizaciones táctiles para móvil */
  @media (max-width: 768px) {
    * { -webkit-tap-highlight-color: transparent; }
    button { min-height: 44px; min-width: 44px; }
  }
  
  /* Scroll suave */
  * { -webkit-overflow-scrolling: touch; }
  
  /* Prevenir zoom accidental en iOS */
  input, select, textarea { font-size: 16px !important; }
</style>
</head>
<body>
<div id="root"></div>
<div id="boot-error"></div>

<!-- Si algo falla al cargar/montar la app, esto lo muestra en pantalla
     en vez de dejar una pantalla negra sin pistas. -->
<script>
  function showBootError(msg, where) {
    const box = document.getElementById('boot-error');
    if (!box) return;
    box.style.display = 'block';
    box.innerHTML =
      '<h1>No se pudo cargar la pizarra</h1>' +
      'Revisá la consola (F12) para más detalle. Error:\n<code>' +
      msg + '</code>' + (where ? '\n' + where : '');
  }
  window.addEventListener('error', (e) => {
    const msg = (e && e.error && e.error.stack) ? e.error.stack : (e.message || String(e));
    showBootError(msg, e.filename ? e.filename + ':' + e.lineno : '');
  });
  // Errores de promesas sin capturar (por ejemplo, fallas al montar React o
  // en el registro del service worker) también deben mostrarse, no quedar
  // en silencio con una pantalla negra.
  window.addEventListener('unhandledrejection', (e) => {
    const r = e && e.reason;
    const msg = (r && r.stack) ? r.stack : String(r || 'Error desconocido');
    showBootError(msg, '');
  });
</script>

<script src="storage-polyfill.js"></script>
<!-- Código JSX compilado en el navegador con Babel -->
<script type="text/babel" src="app.jsx"></script>

<script>
  if ('serviceWorker' in navigator) {
    // Si ya había un service worker controlando esta pestaña, un cambio de
    // controller significa que se activó una versión nueva. Si todavía no
    // había ninguno (primera visita), no es una "actualización".
    const hadController = !!navigator.serviceWorker.controller;
    let notified = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (notified || !hadController) return;
      notified = true;
      window.dispatchEvent(new Event('pizarra8-update-available'));
    });
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    });
  }
</script>
</body>
</html>
